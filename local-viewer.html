<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRMAX - Link Local</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    
    .logo {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }
    
    .logo .nr {
      color: #ff9900;
    }
    
    .logo .max {
      color: #3366cc;
    }
    
    h1 {
      color: #333;
      margin-bottom: 20px;
      font-size: 28px;
    }
    
    .message {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
      font-size: 16px;
    }
    
    .action-btn {
      display: inline-block;
      padding: 16px 32px;
      background: #3366cc;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      margin-bottom: 20px;
      min-width: 200px;
    }
    
    .action-btn:hover {
      background: #2851a3;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    .status {
      background: #e8f4ff;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      color: #0066cc;
      font-size: 14px;
    }
    
    .url-display {
      font-family: monospace;
      background: #f0f0f0;
      padding: 8px;
      border-radius: 4px;
      margin: 10px 0;
      font-size: 12px;
      word-break: break-all;
    }
    
    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <span class="nr">NR</span><span class="max">MAX</span>
    </div>
    
    <h1>Abrir Site NRMAX Localmente</h1>
    
    <p class="message">
      Clique no botão abaixo para visualizar o site NRMAX localmente<br>
      no seu navegador antigravity.
    </p>
    
    <a href="index.html" class="action-btn">
      Visualizar Site NRMAX
    </a>
    
    <div class="status">
      <strong>Status:</strong> Pronto para visualização<br>
      <strong>Arquivo:</strong> index.html (25.7 KB)
    </div>
    
    <div class="footer">
      Local: site-nrmax<br>
      Atualizado: 13/07/2026
    </div>
  </div>
</body>
</html>
