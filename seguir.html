<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguir NRMAX - Visualizar Localmente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .follow-link {
            display: block;
            width: 100%;
            padding: 16px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        
        .follow-link:hover {
            background: #2563eb;
        }
        
        .icon {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .status {
            display: inline-flex;
            align-items: center;
            background: #e8f5e9;
            color: #16a34a;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #16a34a;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Seguir NRMAX</h1>
        <p class="subtitle">Clique no botão abaixo para visualizar o site localmente</p>
        
        <a href="index.html" class="follow-link">
            <span class="icon">👁️</span>
            Visualizar Site NRMAX
        </a>
        
        <div class="status">
            <span class="status-dot"></span>
            Site Ativo - Pronto para Visualizar
        </div>
    </div>
</body>
</html>
