<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clique para Visualizar NRMAX Localmente</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, sans-serif;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0a192f;
      color: #f8f8f8;
    }
    
    .container {
      text-align: center;
      padding: 3rem;
      background: #112240;
      border-radius: 12px;
      max-width: 500px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    h1 {
      color: #ffd700;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    .subtitle {
      color: #8b949e;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }
    
    .view-button {
      display: inline-block;
      padding: 1rem 3rem;
      background: #ffd700;
      color: #0a192f;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border: 2px solid #ffd700;
    }
    
    .view-button:hover {
      background: #ffed4e;
      transform: translateY(-2px);
      box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
    }
    
    .note {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #8b949e;
      font-style: italic;
    }
    
    .terminal-line {
      background: #1a2b3c;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      margin: 1rem 0;
      font-family: 'Courier New', monospace;
      color: #85e89d;
      border: 1px solid #1e3a5f;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>👀 Visualizar NRMAX</h1>
    <p class="subtitle">Clique no botão abaixo para visualizar localmente no seu navegador</p>
    
    <div class="terminal-line">
      ./ Abrir NRMAX-Local.html
    </div>
    
    <a href="index.html" class="view-button">Visualizar Página</a>
    
    <p class="note">
      ✓ Index.html foi encontrado<br>
      ✓ Funciona com visualizador-antigravity<br>
      ✓ Visualização local direta
    </p>
  </div>
</body>
</html>
